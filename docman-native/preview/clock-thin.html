<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#000;font-family:Inter,Arial,sans-serif;color:#fff}
.row{position:relative;width:1080px;height:430px;overflow:hidden;border-bottom:6px solid #000}
.row img{position:absolute;left:0;top:0;width:1080px}
.lab{position:absolute;right:16px;top:10px;font-size:26px;color:#ffd7a0;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:12px}
.clk{position:absolute;left:50px;top:300px;width:210px;height:62px}
.clk svg{width:100%;height:100%;overflow:visible}
</style></head><body>
<div class="row"><img src="../../DOCMAN%20Play%20Store%20Assets/screens-your-set-2026-10-19/original/02-home.jpg"><span class="lab">1  Thin white (like your reference)</span><div class="clk" data-c="#ffffff" data-g="rgba(160,190,255,.55)"></div></div>
<div class="row"><img src="../../DOCMAN%20Play%20Store%20Assets/screens-your-set-2026-10-19/original/02-home.jpg"><span class="lab">2  Thin gold</span><div class="clk" data-c="#ffd08a" data-g="rgba(255,150,50,.7)"></div></div>
<div class="row"><img src="../../DOCMAN%20Play%20Store%20Assets/screens-your-set-2026-10-19/original/02-home.jpg"><span class="lab">3  Thin orange</span><div class="clk" data-c="#ff9a3d" data-g="rgba(255,110,30,.7)"></div></div>
<script>
// own thin line digits on a 10 x 18 grid, rounded corners, round caps
const G={
0:"M3 1H7Q10 1 10 4V14Q10 17 7 17H3Q0 17 0 14V4Q0 1 3 1Z",
1:"M2.5 3.5L6 1V17",
2:"M0 4Q0 1 3 1H7Q10 1 10 4V6Q10 9 7 9H3Q0 9 0 12V17H10",
3:"M0 3Q0 1 3 1H7Q10 1 10 4V5Q10 9 6 9H4M6 9Q10 9 10 13V14Q10 17 7 17H3Q0 17 0 15",
4:"M1 1V9H9M8 1V17",
5:"M10 1H1V8H7Q10 8 10 11V14Q10 17 7 17H3Q0 17 0 15",
6:"M10 3Q10 1 7 1H3Q0 1 0 4V14Q0 17 3 17H7Q10 17 10 14V11Q10 9 7 9H3Q0 9 0 11",
7:"M0 1H10V17",
8:"M3 1H7Q10 1 10 4V5Q10 9 7 9H3Q0 9 0 5V4Q0 1 3 1ZM3 9H7Q10 9 10 13V14Q10 17 7 17H3Q0 17 0 14V13Q0 9 3 9Z",
9:"M0 15Q0 17 3 17H7Q10 17 10 14V4Q10 1 7 1H3Q0 1 0 4V6Q0 9 3 9H7Q10 9 10 7"
};
function clock(el,time){
  const [hh,mm,ss]=time, c=el.dataset.c, g=el.dataset.g;
  let x=0,out="";
  const dig=(d,sc,ox,oy,sw)=>`<g transform="translate(${ox} ${oy}) scale(${sc})"><path d="${G[d]}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const S=2.1, W=10*S, GAP=7;           // digit width 21, height 37.8
  let px=2;
  for(const ch of hh+mm.slice(0,0)){out+=dig(+ch,S,px,10,1.1/S*S*0.55);px+=W+GAP}
  out+=`<circle cx="${px+1}" cy="${10+18*S*0.31}" r="1.7" fill="${c}"/><circle cx="${px+1}" cy="${10+18*S*0.69}" r="1.7" fill="${c}"/>`;px+=12;
  for(const ch of mm){out+=dig(+ch,S,px,10,0.6);px+=W+GAP}
  const S2=0.85;let sx=px+2;
  for(const ch of ss){out+=dig(+ch,S2,sx,10,1.5);sx+=10*S2+4}
  el.innerHTML=`<svg viewBox="0 0 ${sx+4} 62" style="filter:drop-shadow(0 0 5px ${g}) drop-shadow(0 2px 3px rgba(0,0,0,.8))">${out}</svg>`;
}
document.querySelectorAll(".clk").forEach(e=>clock(e,["08","26","43"]));
</script></body></html>
