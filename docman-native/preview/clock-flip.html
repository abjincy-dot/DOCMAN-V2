<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#000;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#fff}
.row{position:relative;width:1080px;height:430px;overflow:hidden;border-bottom:6px solid #000}
.row img{position:absolute;left:0;top:0;width:1080px}
.lab{position:absolute;right:16px;top:10px;font-size:26px;color:#ffd7a0;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:12px}
.fc{position:absolute;left:40px;top:300px;display:flex;gap:5px;align-items:flex-start}
.tile{position:relative;width:58px;height:60px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:800 40px/1 Inter,Arial;letter-spacing:-1px;color:#fff}
.tile:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#000}
.T .tile{background:linear-gradient(180deg,#2a2c33,#17181d);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 8px rgba(0,0,0,.6)}
.N .tile{background:none}
.N .tile{text-shadow:0 2px 4px rgba(0,0,0,.9),0 0 8px rgba(255,255,255,.25)}
.N .tile:after{height:2px;background:rgba(0,0,0,.85);box-shadow:0 1px 0 rgba(255,255,255,.18)}
.s .tile{width:44px;height:48px;font-size:30px}
.ap{font:700 15px/1 Inter,Arial;color:#c9cdd6;margin:2px 0 0 4px;align-self:flex-start}
</style></head><body>
<div class="row"><img src="../../DOCMAN%20Play%20Store%20Assets/screens-your-set-2026-10-19/original/02-home.jpg"><span class="lab">1  Flip tiles (like your picture)</span>
<div class="fc T"><div class="tile">01</div><div class="tile">28</div><div class="tile s" style="width:44px;height:48px;font-size:30px;margin-top:6px">07</div></div></div>
<div class="row"><img src="../../DOCMAN%20Play%20Store%20Assets/screens-your-set-2026-10-19/original/02-home.jpg"><span class="lab">2  Flip digits, no tiles (no banner)</span>
<div class="fc N"><div class="tile">01</div><div class="tile">28</div><div class="tile s" style="width:44px;height:48px;font-size:30px;margin-top:6px">07</div></div></div>
</body></html>
