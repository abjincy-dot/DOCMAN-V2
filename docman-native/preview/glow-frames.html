<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f1f;font-family:Inter,Arial,sans-serif;color:#99a;padding:20px;display:flex;gap:40px}
.hdr{background:linear-gradient(180deg,#141a35,#0b1022);border-radius:16px;padding:24px 34px 40px;display:flex;gap:26px;align-items:center}
.lab{font-size:12px;margin:0 0 8px}
.cal{position:relative;width:76px;height:76px;container-type:size;flex:none;isolation:isolate}
.big{width:300px;height:300px}
.glow{position:absolute;left:10%;right:10%;bottom:-11%;height:44%;z-index:-2;
 background:radial-gradient(ellipse at 50% 50%,rgba(255,160,45,.95) 0%,rgba(255,150,40,.6) 34%,rgba(255,150,40,.22) 56%,rgba(255,150,40,0) 74%);filter:blur(1.2cqh)}
.pic{position:absolute;inset:0;background:url(calendar-tray-v5.png) center/contain no-repeat;z-index:-1}
.up .pic,.up .d,.up .n{translate:0 -6.6cqh}
.d,.n{position:absolute;left:0;width:100%;text-align:center;line-height:1;font-weight:900}
.d{top:21.19cqh;font-size:12.35cqh;color:#e10000}
.n{top:31.37cqh;font-size:17.25cqh;color:#060f1c;transform:scaleX(1.4);font-weight:800}
</style></head><body>
<div><p class="lab">Resting</p><div class="hdr"><div class="cal"><div class="glow"></div><div class="pic"></div><span class="d">Mon</span><span class="n">19</span></div><div class="cal big"><div class="glow"></div><div class="pic"></div><span class="d">Mon</span><span class="n">19</span></div></div></div>
<div><p class="lab">Floated up (the glow stays)</p><div class="hdr up"><div class="cal"><div class="glow"></div><div class="pic"></div><span class="d">Mon</span><span class="n">19</span></div><div class="cal big"><div class="glow"></div><div class="pic"></div><span class="d">Mon</span><span class="n">19</span></div></div></div>
</body></html>
