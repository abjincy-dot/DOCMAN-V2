// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
        // google-services (Firebase) intentionally not on the classpath:
        // DOCMAN has no Firebase, no analytics and no push. app/build.gradle
        // still has a guarded 'apply plugin' block that only fires when a
        // google-services.json exists -- if push is ever added, restore
        // classpath 'com.google.gms:google-services:4.4.0' here too, or
        // that block will fail to resolve the plugin.

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}