apply plugin: 'com.android.application'

// Release signing credentials live in android/keystore.properties -- a
// local-only file (gitignored, never committed) holding storeFile/
// storePassword/keyAlias/keyPassword. Loaded defensively: its absence
// shouldn't break debug builds (or any build before the keystore was
// set up), only release signing.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.docman"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    if (hasKeystoreProperties) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.docman"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 38
        versionName "1.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        // Test builds install as a SEPARATE app (com.docman.dev, labelled
        // "DOCMAN dev") so they sit BESIDE the Play-installed copy instead of
        // replacing it: a local build is signed with a different key, so
        // Android would otherwise demand an uninstall first, which would take
        // the user's real documents with it.
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders = [appLabel: "DOCMAN dev"]
        }
        release {
            manifestPlaceholders = [appLabel: "@string/app_name"]
            ndk { debugSymbolLevel "SYMBOL_TABLE" } // ships symbols so Play can read crash stacks
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreProperties) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation('io.github.oothp:android-pdf-viewer:3.2.0-beta06') {
        exclude group: 'com.android.support'
    }
    // A second pdfium build, kept ONLY for its text API (FPDFText_*), which
    // the viewer's own pdfium fork does not expose. It reads a page's text
    // straight from the file, so memory use is per page: search works on a
    // 300 MB drawing set, where PDFBox (which parses a whole document into the
    // Java heap) was OutOfMemory-killed. Costs ~5 MB per ABI in the download.
    implementation 'io.legere:pdfiumandroid:1.0.20'
    // Still used for everything that WRITES a PDF (highlights, signatures,
    // form fill, erase/crop) and as the fallback text path.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // On-device OCR fallback for scanned/image-only pages, where PDFBox
    // finds no real text objects to extract. Latin-script recognizer only
    // for v1. Fully on-device (no network call, no API key/google-services.json
    // needed) -- requires Google Play Services on the device, a safe
    // assumption for a consumer Android app.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // "Scan Document": Google's ML Kit document scanner (edge detection,
    // auto-capture, multi-page, filters). Its screens and models are
    // delivered by Google Play services, so DOCMAN needs no CAMERA permission
    // and the APK barely grows. Needs Play services and ~1.7 GB RAM.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    // Fingerprint / Face unlock (App Lock security feature) — wraps
    // whatever biometric methods the device has enrolled (fingerprint,
    // face, iris) behind one system prompt, no separate integration
    // needed per biometric type.
    implementation "androidx.biometric:biometric:1.1.0"
    // Lets DocmanApplication tell "the whole app was backgrounded" apart
    // from "one Activity briefly stopped for a share sheet/print dialog/
    // camera" -- the standard AndroidX way to drive App-Lock-style
    // re-authentication without a hand-rolled counter that gets that
    // distinction wrong. Almost certainly already present transitively
    // via AndroidX/Capacitor, declared explicitly since it's load-bearing.
    implementation "androidx.lifecycle:lifecycle-process:2.8.7"
    // Google Play Billing -- the one-time "DOCMAN Pro" unlock. This is the
    // only part of the app that talks to a network: purchase verification
    // goes to Google, never to us, and no document ever leaves the device.
    // Privacy policy sections 7 and 8 and the Play Data Safety form both
    // need updating to say so before this ships.
    implementation "com.android.billingclient:billing:8.0.0"
    // "Rate DOCMAN": Google Play's in-app review card. Google draws it and
    // decides whether it shows; no data of ours is involved.
    implementation "com.google.android.play:review:2.0.2"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}