<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>DOCMAN feature graphic</title>
<style>
  @font-face{font-family:Inter;src:url("../docman-native/www/vendor/inter/files/inter-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:block;}
  @font-face{font-family:Inter;src:url("../docman-native/www/vendor/inter/files/inter-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:block;}
  @font-face{font-family:Inter;src:url("../docman-native/www/vendor/inter/files/inter-latin-700-normal.woff2") format("woff2");font-weight:700;font-display:block;}
  @font-face{font-family:Inter;src:url("../docman-native/www/vendor/inter/files/inter-latin-800-normal.woff2") format("woff2");font-weight:800;font-display:block;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{
    font-family:Inter,"Segoe UI",system-ui,sans-serif;
    /* Opaque: Play rejects transparency in the feature graphic. */
    background:#0a0e28;
    position:relative;
  }
  .bg{position:absolute;inset:0;
    background:
      radial-gradient(60% 90% at 12% 40%, rgba(59,90,255,.55) 0%, rgba(59,90,255,0) 62%),
      radial-gradient(55% 80% at 88% 62%, rgba(147,51,234,.45) 0%, rgba(147,51,234,0) 60%),
      radial-gradient(40% 60% at 74% 12%, rgba(249,115,22,.20) 0%, rgba(249,115,22,0) 65%),
      linear-gradient(125deg,#0b1140 0%,#131a4d 42%,#1a1140 74%,#0d0a26 100%);
  }
  /* Everything sits inside a safe margin -- Play crops the edges on some surfaces. */
  .stage{position:absolute;inset:34px 40px;display:flex;align-items:center;gap:34px}

  .icon-wrap{flex:none;width:212px;height:212px;position:relative}
  .icon-glow{position:absolute;inset:-26px;border-radius:56px;
    background:radial-gradient(circle,rgba(96,130,255,.55) 0%,rgba(96,130,255,0) 70%);}
  .icon-wrap img{position:relative;width:212px;height:212px;border-radius:48px;display:block;
    box-shadow:0 22px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.14);}

  .mid{flex:1;min-width:0}
  .wordmark{font-weight:800;font-size:66px;line-height:1;letter-spacing:-.02em;color:#fff}
  .wordmark .man{color:#ff8a3d}
  .sub{margin-top:7px;font-weight:600;font-size:17.5px;letter-spacing:.30em;color:#aab6e8;
       text-transform:uppercase}
  .rule{width:74px;height:3px;border-radius:2px;margin:13px 0 15px;
        background:linear-gradient(90deg,#ff8a3d,#ff5fa2)}
  .feats{display:flex;flex-direction:column;gap:11px}
  .feat{display:flex;align-items:center;gap:12px}
  .dot{flex:none;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;
       justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.4)}
  .dot svg{width:18px;height:18px;display:block;fill:#fff}
  .feat span{font-weight:700;font-size:20px;color:#fff;letter-spacing:-.01em;white-space:nowrap}

  /* Document-type cards fanned out of a folder. */
  .docs{flex:none;width:250px;height:250px;position:relative;margin-right:6px}
  .card{position:absolute;width:96px;height:118px;border-radius:14px;background:#fff;
        box-shadow:0 16px 34px rgba(0,0,0,.5);display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:8px}
  .card b{font-size:14px;font-weight:800;letter-spacing:.06em}
  .chip{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .chip svg{width:22px;height:22px;fill:#fff}
  .c1{left:6px;  top:14px;  transform:rotate(-11deg)}
  .c2{left:112px;top:2px;   transform:rotate(7deg)}
  .c3{left:2px;  top:126px; transform:rotate(-5deg)}
  .c4{left:118px;top:120px; transform:rotate(12deg)}

  .badges{position:absolute;left:40px;bottom:26px;display:flex;align-items:center;gap:26px}
  .badge{display:flex;align-items:center;gap:8px;color:#c3cdf2;font-size:14.5px;
         font-weight:600;letter-spacing:.13em;text-transform:uppercase}
  .badge svg{width:16px;height:16px;fill:#8fa3e8}
  .sep{width:1px;height:15px;background:rgba(255,255,255,.20)}
  .tagline{position:absolute;right:40px;bottom:24px;text-align:right;color:#93a2dd;
           font-size:14.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;
           line-height:1.65}
</style></head>
<body>
<div class="bg"></div>

<div class="stage">
  <div class="icon-wrap">
    <div class="icon-glow"></div>
    <img src="__ICON__" alt="DOCMAN">
  </div>

  <div class="mid">
    <div class="wordmark">DOC<span class="man">MAN</span></div>
    <div class="sub">Document Manager</div>
    <div class="rule"></div>
    <div class="feats">
      <div class="feat">
        <span class="dot" style="background:linear-gradient(140deg,#f59e0b,#d97706)">
          <svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>
        </span><span>Smart Folders</span>
      </div>
      <div class="feat">
        <span class="dot" style="background:linear-gradient(140deg,#ef4444,#b91c1c)">
          <svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14a0 0 0 0 1 0 0H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5z"/></svg>
        </span><span>Native PDF Tools</span>
      </div>
      <div class="feat">
        <span class="dot" style="background:linear-gradient(140deg,#8b5cf6,#6d28d9)">
          <svg viewBox="0 0 24 24"><path d="M21 5H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM8 9a1.6 1.6 0 1 1 0 3.2A1.6 1.6 0 0 1 8 9zm-3 8 4-4.5 2.6 3 3.2-4.2L20 17H5z"/></svg>
        </span><span>Image Editor</span>
      </div>
      <div class="feat">
        <span class="dot" style="background:linear-gradient(140deg,#10b981,#047857)">
          <svg viewBox="0 0 24 24"><path d="M12 22a2.4 2.4 0 0 0 2.4-2.4H9.6A2.4 2.4 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5.3-6.8V3.5a1.7 1.7 0 1 0-3.4 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/></svg>
        </span><span>Expiry Reminders</span>
      </div>
    </div>
  </div>

  <div class="docs">
    <div class="card c1">
      <span class="chip" style="background:linear-gradient(140deg,#ef4444,#b91c1c)">
        <svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>
      </span><b style="color:#c62828">PDF</b>
    </div>
    <div class="card c2">
      <span class="chip" style="background:linear-gradient(140deg,#3b82f6,#1d4ed8)">
        <svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>
      </span><b style="color:#1d4ed8">DOC</b>
    </div>
    <div class="card c3">
      <span class="chip" style="background:linear-gradient(140deg,#22c55e,#15803d)">
        <svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v14H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>
      </span><b style="color:#15803d">XLS</b>
    </div>
    <div class="card c4">
      <span class="chip" style="background:linear-gradient(140deg,#a855f7,#7e22ce)">
        <svg viewBox="0 0 24 24"><path d="M21 5H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM8 9a1.6 1.6 0 1 1 0 3.2A1.6 1.6 0 0 1 8 9zm-3 8 4-4.5 2.6 3 3.2-4.2L20 17H5z"/></svg>
      </span><b style="color:#7e22ce">IMG</b>
    </div>
  </div>
</div>

<div class="tagline">All your documents<br>in one place</div>

<div class="badges">
  <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.2 3.8 10.1 9 12 5.2-1.9 9-6.8 9-12V5l-9-4z"/></svg>Secure</span>
  <span class="sep"></span>
  <span class="badge"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>Fast</span>
  <span class="sep"></span>
  <span class="badge"><svg viewBox="0 0 24 24"><path d="M19.4 10a7.5 7.5 0 0 0-14-2A5.5 5.5 0 0 0 6 19h13a4.5 4.5 0 0 0 .4-9zM4 3l17 17-1.4 1.4L2.6 4.4 4 3z"/></svg>Works Offline</span>
  <span class="sep"></span>
  <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6l-8-4zm-1 13-3-3 1.4-1.4L11 12.2l4.6-4.6L17 9l-6 6z"/></svg>No Ads</span>
</div>
</body></html>
